version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: databridge-postgres-local
    environment:
      POSTGRES_DB: databridge_local
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: dbpass
    ports:
      - "5432:5432"
    volumes:
      - databridge_pgdata:/var/lib/postgresql/data

volumes:
  databridge_pgdata:
    driver: local

