spring:
  profiles: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:databridge}
    username: ${DB_USER:databridge}
    password: ${DB_PASS:changeMe}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      dialect: org.hibernate.dialect.PostgreSQLDialect
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

aws:
  region: ${AWS_REGION:us-east-1}
  secretsManager:
    secretName: ${AWS_SECRET_NAME:databridge/config}

logging:
  pattern:
    console: "%d{ISO8601} [%X{X-Correlation-Id}] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
